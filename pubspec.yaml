name: quizly
description: "Projek UTS Lab Pemmob"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/Assets/Ikon Q Ungu Berlapis Modern.png

  fonts:
    - family: Manrope
      fonts:
        - asset: lib/Assets/Manrope-VariableFont_wght.ttf
    - family: DMSans
      fonts:
        - asset: lib/Assets/DMSans-VariableFont_opsz,wght.ttf
        - asset: lib/Assets/DMSans-Italic-VariableFont_opsz,wght.ttf
          style: italic